
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login GOAL NEWS - Portal Berita Bola</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #08a85b, #075c35);
            padding: 20px;
        }

        .container {
            width: 900px;
            max-width: 100%;
            min-height: 500px;
            display: flex;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px #0003;
        }

        .kiri {
            width: 50%;
            background: linear-gradient(150deg, #0ab968, #087344);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .logo {
            font-size: 75px;
            color: #ffd43b;
            margin-bottom: 25px;
        }

        .kiri h1 {
            font-size: 28px;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .kiri p {
            font-size: 13px;
            line-height: 1.6;
        }

        .kanan {
            width: 50%;
            padding: 45px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .kanan h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            border-color: #08a99e;
        }

        .lupa {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 22px;
        }

        .lupa a {
            text-decoration: none;
            color: #078eb9;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #168fc5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0876a6;
        }

        #pesan {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
        }

        @media (max-width: 650px) {
            .container {
                flex-direction: column;
            }

            .kiri, .kanan {
                width: 100%;
            }

            .kiri {
                min-height: 250px;
            }

            .kiri h1 {
                font-size: 23px;
            }

            .kanan {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- BAGIAN KIRI -->
        <div class="kiri">
            <div class="logo">⚽</div>

            <h1>GOAL NEWS</h1>

            <p>
                Selamat datang di GOAL NEWS.
                Portal berita sepak bola terpercaya
                yang menyajikan informasi terbaru
                seputar dunia sepak bola.
            </p>
        </div>

        <!-- BAGIAN KANAN -->
        <div class="kanan">

            <h2>Login Akun</h2>

            <form id="loginForm">

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    required
                >

                <div class="lupa">
                    <a href="#" onclick="alert('Silakan hubungi admin.'); return false;">
                        Lupa Password?
                    </a>
                </div>

                <button type="submit">LOGIN</button>

                <p id="pesan"></p>

            </form>

        </div>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            let pesan = document.getElementById("pesan");

            if (username === "ahmad" && password === "12345") {
                alert("Login berhasil! Selamat datang di GOAL NEWS.");
                window.location.href = "index.html";
            } else {
                pesan.style.color = "red";
                pesan.textContent = "Username atau password salah!";
            }
        });
    </script>

</body>
</html>
